version: "3.9"

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  bench:
    image: frappe/bench:latest
    working_dir: /home/frappe
    depends_on:
      - mariadb
      - redis
    environment:
      SHELL: /bin/bash
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      SITE_NAME: ${SITE_NAME}
    command:
      - bash
      - -lc
      - |
        set -e
        echo ">>> Cleaning old bench…"
        rm -rf frappe-bench
        echo ">>> Initializing bench…"
        bench init --skip-redis-config-generation frappe-bench
        cd frappe-bench
        bench set-mariadb-host mariadb
        bench set-redis-cache-host redis:6379
        bench set-redis-queue-host redis:6379
        bench set-redis-socketio-host redis:6379
        sed -i '/redis/d' Procfile
        sed -i '/watch/d' Procfile
        bench get-app crm --branch develop
        bench new-site ${SITE_NAME} \
          --force \
          --mariadb-root-password ${DB_ROOT_PASSWORD} \
          --admin-password admin \
          --no-mariadb-socket
        bench --site ${SITE_NAME} install-app crm
        bench --site ${SITE_NAME} set-config developer_mode 0
        bench --site ${SITE_NAME} clear-cache
        bench --site ${SITE_NAME} set-config mute_emails 1
        bench use ${SITE_NAME}
        echo ">>> Starting bench…"
        bench start
    volumes:
      - bench-sites:/home/frappe/frappe-bench
    labels:
      - traefik.enable=true
      - "traefik.http.routers.crm.rule=Host(`${SITE_NAME}`)"
      - traefik.http.routers.crm.entrypoints=websecure
      - traefik.http.routers.crm.tls.certresolver=letsencrypt
      - traefik.http.services.crm.loadbalancer.server.port=8000

volumes:
  mariadb-data:
  bench-sites:
